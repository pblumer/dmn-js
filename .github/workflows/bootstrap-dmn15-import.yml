name: Bootstrap DMN 1.5 import

on:
  push:
    branches:
      - feature/dmn-1.5-import

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ !contains(github.event.head_commit.message, '[skip dmn15 bootstrap]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Apply DMN 1.5 model selection
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          const managerPath = 'packages/dmn-js-shared/src/base/Manager.js';
          let manager = fs.readFileSync(managerPath, 'utf8');

          const oldDocs = '   * @param  {Object} options\n';
          const newDocs = '   * @param  {Object} options\n   * @param  {string} [options.dmnVersion] DMN metamodel version\n';

          if (!manager.includes(newDocs)) {
            if (!manager.includes(oldDocs)) {
              throw new Error('Manager constructor documentation anchor not found');
            }
            manager = manager.replace(oldDocs, newDocs);
          }

          const oldFactory = '  _createModdle(options) {\n    return new DmnModdle(options.moddleExtensions);\n  }';
          const newFactory = "  _createModdle(options) {\n    return new DmnModdle(options.moddleExtensions, {\n      dmnVersion: options.dmnVersion\n    });\n  }";

          if (!manager.includes(newFactory)) {
            if (!manager.includes(oldFactory)) {
              throw new Error('Manager moddle factory anchor not found');
            }
            manager = manager.replace(oldFactory, newFactory);
          }

          fs.writeFileSync(managerPath, manager);

          const packagePath = 'packages/dmn-js-shared/package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          pkg.dependencies['dmn-moddle'] = 'github:pblumer/dmn-moddle#23697fac646aaa0bc09d9ce3ae90c96769397bc6';
          fs.writeFileSync(packagePath, JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - name: Refresh npm lockfile
        run: npm install --package-lock-only

      - name: Commit implementation and lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/dmn-js-shared/src/base/Manager.js packages/dmn-js-shared/package.json package-lock.json

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "feat: add DMN 1.5 model selection [skip dmn15 bootstrap]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
